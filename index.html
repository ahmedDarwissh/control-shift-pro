<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Shift Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', 'Poppins', sans-serif; 
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden; /* Prevent horizontal scroll */
      font-weight: 400; /* Default font weight */
    }
    body.lang-en {
      font-family: 'Poppins', 'Cairo', sans-serif; 
    }
    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px; 
    }
    ::-webkit-scrollbar-track {
      background: #e5e7eb; /* gray-200 */
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #9ca3af; /* gray-400 */
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280; /* gray-500 */
    }
    .dark ::-webkit-scrollbar-track {
      background: #374151; /* gray-700 */
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #6b7280; /* gray-500 */
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #9ca3af; /* gray-400 */
    }

    /* Toast Notification Styles (will be updated via App.tsx for theme consistency) */
    .toast-notification {
      padding: 12px 18px;
      border-radius: 0.75rem; /* rounded-xl */
      color: white;
      font-size: 0.875rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); /* shadow-lg */
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      margin-bottom: 8px;
    }
    .toast-notification.show {
      opacity: 1;
      transform: translateY(0);
    }
    /* Specific toast colors will be managed by App.tsx themes */

    body {
      background-color: #F9FAFB; /* gray-50, default light theme */
    }
    body.dark {
      background-color: #111827; /* gray-900, default dark theme */
    }
    
    /* Sidebar transition */
    .sidebar-transition {
      transition: transform 0.3s ease-in-out;
    }

    /* Animation for content fade in */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeInUp { animation: fadeInUp 0.5s ease-out forwards; }

    /* For FunStuffView animations (can be kept or refined) */
    @keyframes pulse-once {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pulse-once {
      animation: pulse-once 0.5s ease-in-out;
    }
    .animate-wiggle {
      animation: wiggle 1.5s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
     .animate-pulse-slow {
      animation: pulse 3s infinite ease-in-out;
    }
    .animate-bounceSlow {
        animation: bounceSlow 2s infinite;
    }
    @keyframes bounceSlow {
        0%, 100% {
            transform: translateY(-15%);
            animation-timing-function: cubic-bezier(0.8,0,1,1);
        }
        50% {
            transform: none;
            animation-timing-function: cubic-bezier(0,0,0.2,1);
        }
    }
  </style>
</head>
